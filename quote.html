<!doctype html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <title>quotes demo page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet">
    <style>
        body {
            background: grey;
            color: rgb(222, 38, 188);
            font-family: "Shadows Into Light", cursive;
            font-weight: 400;
            font-style: normal;
            text-align: center;

        }

        .uppercase {
            text-transform: uppercase;
            text-decoration: underline;
            text-decoration-color: rgb(91, 96, 96);
            size: 10in;
        }

        .quoteone {
            size: 10in;
            font-size: large;
            text-align: center;
            text-shadow: 10cm;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .quotetwo {
            font-size: large;
            text-indent: 6cm;
            font-family: 'Times New Roman', Times, serif;
        }

        .quotethree {
            font-size: large;
            font-family: Georgia, 'Times New Roman', Times, serif;
            text-decoration-line: overline;
        }
    </style>

</head>


<body>
    <p class="quoteone">Believe you can and you're halfway there. </p>
    <p class="uppercase">Theodore Roosevelt </p>

    <p class="quotetwo"></p>Success is not final, failure is not fatal: it is the courage to continue that counts.</p>
    <p class="uppercase">Winston Churchill</p>


    <p class="quotethree"></p>To love oneself is the beginning of a lifelong romance.</p>
    <p class="uppercase">Oscar Wilde</p>
</body>

</html>
