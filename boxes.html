<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title> my boxes page</title>
  <style>
    body {
      background: linear-gradient( 0deg,  rgb(200, 124, 156) 11.2%, rgb(228, 79, 174) 81.7% );
      background-size: cover;
      background-attachment: fixed;
    }
    div {
      background: rgb(208, 95, 180);
      border: 10px solid rgb(182, 56, 108);
      width: 500px;
      height: 100px;
      padding: 20px;
      margin: 20px;
      border-radius: 30px;
    }

    #one {
      background: rgb(185, 127, 224);
      border: 10px solid rgb(136, 23, 142);
      border-bottom: 25px solid rgb(136, 23, 142);
      color: rgb(221, 33, 162);
      margin-left: 200px;
      border-bottom-left-radius: 0px;
      border-bottom-right-radius: 0px;
      border-top-right-radius: 200px;
      border-top-left-radius: 200px;
      text-align: center;
    }

    #two {
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }
    #three {
      width: 800px;
      height: 200px;
      background-image: linear-gradient( 270deg,  rgb(219, 24, 73) 11.2%, rgb(205, 29, 126) 81.7% );
    }
    #four {
      width: 200px;
      height: 50px;
    }
  </style>
</head>

<body>
  <div id="one">
    <p>this is a box!</p>
  </div>
  <div id="two">
    <p>this is a box!</p>
  </div>
  <div id="three">
    <p>this is a box!</p>
    <div id="four">
      <p>this is a box!</p>
    </div>
  </div>
</body>

</html>
